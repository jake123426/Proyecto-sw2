name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: backend-app
  DOCKERHUB_USERNAME: xjake

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env.dev file
        run: |
          echo "${{ secrets.DEV_ENV_FILE }}" > .env.dev

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint
# asd
      - name: Save code as artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-code
          path: |
            ./
            !./node_modules
            !./.env.dev
  build-publish:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Get code from artifact
        uses: actions/download-artifact@v4
        with:
          name: source-code

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
  deploy:
    runs-on: ubuntu-latest
    needs: build-publish
    # outputs:
    #   rollback_status: ${{ steps.rollback.conclusion }}
    steps:
      - name: Deploy via SSH to remote server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            CURRENT_IMAGE=$(docker inspect --format '{{.Config.Image}}' ${{ env.IMAGE_NAME }} 2>/dev/null || echo "")
            docker rm -f ${{ env.IMAGE_NAME }} || true
            docker run --name ${{ env.IMAGE_NAME }} \
              -e "DB_URI=${{ secrets.DB_URI }}" \
              --restart unless-stopped \
              -dp 80:3000 ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

            echo "Esperando estado saludable..."
            for i in {1..10}; do
              if curl -sSf http://localhost:80/health >/dev/null; then
                echo "Health check passed"
                exit 0
              fi
              sleep 2
            done

            echo "Health check failed"
            if [ -n "$CURRENT_IMAGE" ]; then
              echo "Haciendo rollback a $CURRENT_IMAGE"
              docker rm -f ${{ env.IMAGE_NAME }} || true
              docker run --name ${{ env.IMAGE_NAME }} \
                -e "DB_URI=${{ secrets.DB_URI }}" \
                --restart unless-stopped \
                -dp 80:3000 $CURRENT_IMAGE
            fi
            exit 1
  notify-deployment:
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Send deployment notification email
        uses: dawidd6/action-send-mail@v3
        with:
          from: El Jefesito
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Deploy Status: ${{ needs.deploy.result }}"
          to: ${{ secrets.EMAIL_USER }}
          body: |
            Workflow: ${{ github.workflow }}
            Resultado: ${{ needs.deploy.result }}            
            Ver más: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # cleanup:
  #   runs-on: ubuntu-latest
