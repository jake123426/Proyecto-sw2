name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
env:  
  IMAGE_NAME: backend-app
jobs:
  test:
    runs-on: self-hosted
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - name: Show workspace test
        run: pwd && ls -la
      - name: Install dependencies        
        run: npm ci
      - run: |
          touch ./.env.dev
          echo "${{ secrets.DEV_ENV_FILE }}" > ./.env.dev
      - name: Run tests
        run: npm test
      - name: Run lint
        run: npm run lint      
      - name: Save code as artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-code
          path: .

  build-publish:
    runs-on: self-hosted
    needs: test
    steps:
      - name: Get code from artifact
        uses: actions/download-artifact@v4
        with:
          name: source-code
      - name: Show workspace build-publish
        run: pwd && ls -la
      - name: Log in to Docker Hub 
        uses: docker/login-action@v3 
        with: 
          username: ${{ secrets.DOCKERHUB_USERNAME }}         
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Setup Docker cache Directory
        run: |
          mkdir -p /tmp/docker-cache /tmp/docker-cache-new
          chmod -R 777 /tmp/docker-cache*
      - name: Build and push
        uses: docker/build-push-action@v6 
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=local,src=/tmp/docker-cache
          cache-to: type=local,dest=/tmp/docker-cache-new,mode=max
          builder: aws-builder
      - name: Rotate cache
        if: success()
        run: |
          rm -rf /tmp/docker-cache-old
          mv /tmp/docker-cache /tmp/docker-cache-old
          mv /tmp/docker-cache-new /tmp/docker-cache
  deploy: 
    runs-on: self-hosted
    needs: build-publish
    steps:      
      - name: Stop and remove old container         
        run: | 
            docker rm -f ${{ env.IMAGE_NAME }} || true
      - name: Debug variables
        run: |
          echo "DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}"
          echo "IMAGE_NAME: ${{ env.IMAGE_NAME }}"
          echo "GITHUB_SHA: ${{ github.sha }}"
          echo "Full image reference: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"            
      - name: Run container
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Attempting to run image: $IMAGE"
          docker run -d \
            --name ${{ env.IMAGE_NAME }} \
            -e "DB_URI=${{ secrets.DB_URI }}" \
            --restart unless-stopped \          
            -p 80:3000 \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
      - name: Health check
        run: |
          curl --retry 5 --retry-delay 10 --fail http://localhost:3000/health
  cleanup:
    runs-on: self-hosted 
    needs: deploy 
    if: always()
    steps: 
      - name: Prune system          
        run: |
          docker system prune -f --filter "until=24h"
          docker builder prune -f


  
